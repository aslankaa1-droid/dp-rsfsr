<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 96" role="img" aria-label="ЦПФСР.РФ — Цифровая Платформа Финансирования Социального Развития">
  <defs>
    <linearGradient id="lock-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2B5C"/><stop offset="100%" stop-color="#163A75"/>
    </linearGradient>
    <linearGradient id="lock-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5A572"/><stop offset="100%" stop-color="#E4C892"/>
    </linearGradient>
  </defs>
  <!-- знак: скруглённый квадрат + золотая рамка + засечная «Р» -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#lock-navy)"/>
    <rect x="7.5" y="7.5" width="65" height="65" rx="14" fill="none" stroke="url(#lock-gold)" stroke-width="1.8"/>
    <text x="40" y="42" text-anchor="middle" dominant-baseline="central"
          font-family="Georgia,'Times New Roman','PT Serif',serif" font-weight="700"
          font-size="52" fill="#FFFFFF">Р</text>
  </g>
  <!-- текст справа -->
  <g transform="translate(104, 0)" font-family="'Inter Tight','Inter',system-ui,sans-serif">
    <text x="0" y="40" font-size="32" font-weight="700" letter-spacing="-0.5" fill="currentColor">ЦПФСР.РФ</text>
    <text x="2" y="62" font-size="10.5" font-weight="500" letter-spacing="1.6" fill="currentColor" opacity="0.62" style="text-transform:uppercase">Цифровая Платформа</text>
    <text x="2" y="76" font-size="10.5" font-weight="500" letter-spacing="1.6" fill="currentColor" opacity="0.62" style="text-transform:uppercase">Финансирования Социального Развития</text>
  </g>
</svg>
