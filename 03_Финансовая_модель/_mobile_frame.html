<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;padding:0}iframe{border:0;display:block}</style>
<iframe id="f" src="_mobile_probe.html" width="360" height="1400"></iframe>
<script>
function probe(doc, win) {
  var vw = doc.documentElement.clientWidth;
  var over = [], tiny = [], small = [], seen = {};
  var all = doc.querySelectorAll('body *');
  for (var i = 0; i < all.length; i++) {
    var el = all[i], cs = win.getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') continue;
    var r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) continue;
    var id = el.tagName + '.' + ((el.className || '') + '').split(' ')[0];
    var offcanvas = (cs.position === 'fixed' && cs.transform !== 'none') ||
                    el.closest('.drawer, .drawer-overlay, .skip-link, .skip, .sr-only, [aria-hidden="true"]') ||
                    r.right < -100;
    if (!offcanvas && (r.right > vw + 1 || r.left < -1)) {
      var scrollable = (cs.overflowX === 'auto' || cs.overflowX === 'scroll' || cs.overflowX === 'hidden');
      var p = el.parentElement;
      while (!scrollable && p && p !== doc.body) {
        var pc = win.getComputedStyle(p);
        if (pc.overflowX === 'auto' || pc.overflowX === 'scroll' || pc.overflowX === 'hidden') scrollable = true;
        p = p.parentElement;
      }
      var decorative = (el.textContent || '').trim() === '' && r.width < 24 && r.height < 24;
      if (!scrollable && !decorative && !seen['o' + id]) {
        seen['o' + id] = 1;
        over.push({el: id, left: Math.round(r.left), right: Math.round(r.right), txt: (el.textContent || '').trim().slice(0, 30)});
      }
    }
    var fs = parseFloat(cs.fontSize);
    if (fs && fs < 12 && (el.textContent || '').trim().length > 12 && !seen['f' + id] &&
        !el.closest('.ticker, .app, .top-bar__brand, .topbar-brand')) {
      seen['f' + id] = 1; tiny.push({el: id, size: fs});
    }
    var t = el.tagName;
    // ссылка внутри абзаца или ячейки — часть текста, а не отдельная кнопка
    var inline = t === 'A' && el.parentElement &&
                 /^(P|LI|TD|TH|SPAN|EM|STRONG|BLOCKQUOTE|H1|H2|H3|H4)$/.test(el.parentElement.tagName);
    if (!inline && (t === 'A' || t === 'BUTTON' || t === 'INPUT' || t === 'SELECT') &&
        r.height > 0 && (r.height < 32 || r.width < 24) && !seen['t' + id]) {
      seen['t' + id] = 1; small.push({el: id, w: Math.round(r.width), h: Math.round(r.height), txt: (el.textContent || '').trim().slice(0, 24)});
    }
  }
  var clipped = win.getComputedStyle(doc.body).overflowX === 'hidden' ||
                win.getComputedStyle(doc.documentElement).overflowX === 'hidden';
  return {vw: vw, scrollW: doc.documentElement.scrollWidth,
          hScroll: !clipped && doc.documentElement.scrollWidth > vw + 1,
          over: over.slice(0, 12), tiny: tiny.slice(0, 8), small: small.slice(0, 8)};
}
setTimeout(function () {
  var f = document.getElementById('f');
  var res;
  try { res = probe(f.contentDocument, f.contentWindow); }
  catch (e) { res = {error: String(e)}; }
  document.title = 'PROBE:' + JSON.stringify(res);
}, 2200);
</script>
